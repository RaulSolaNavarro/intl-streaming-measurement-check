<!--
  Shows the author's LinkedIn URL on its own line under the author name.
  Quarto's title block has no slot for this, so the author name (already a
  link to the profile, set in index.qmd) gets a second line added here.
-->
<script>
  (function () {
    var url = "https://www.linkedin.com/in/raul-sola-navarro/";
    var author = document.querySelector(".quarto-title-meta-contents p");
    if (!author) return;
    var line = document.createElement("p");
    line.style.margin = "0";
    line.style.fontSize = "0.9em";
    var link = document.createElement("a");
    link.href = url;
    link.textContent = url;
    line.appendChild(link);
    author.insertAdjacentElement("afterend", line);
  })();
</script>
